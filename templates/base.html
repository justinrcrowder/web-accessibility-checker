<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Web Accessibility Checker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Web Accessibility Checker</a>
    <p class="tagline">Check any webpage for common WCAG 2.1 accessibility issues.</p>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>Audits 8 common issues: page title, language, image alt text, form labels,
       link &amp; button text, heading order, and multiple h1s.</p>
  </footer>
</body>
</html>
